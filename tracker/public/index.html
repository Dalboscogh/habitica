<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>quest stats</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --border: #262a33;
        --text: #e6e8ee;
        --muted: #8a91a3;
        --accent: #8b5cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; }
      header .meta { color: var(--muted); font-size: 12px; }
      main {
        padding: 18px 24px;
        display: grid;
        gap: 18px;
        grid-template-columns: 1fr;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row label { font-size: 12px; color: var(--muted); }
      select, button {
        background: #0d1016;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        font: inherit;
      }
      button:hover { border-color: var(--accent); cursor: pointer; }
      .chart-wrap { position: relative; height: 320px; }
      .chart-wrap.big { height: 380px; }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      th { color: var(--muted); font-weight: 500; font-size: 12px; }
      .tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        background: #222633;
        color: var(--muted);
      }
      .tag.habit { background: #2a1f3d; color: #c5a8ff; }
      .tag.daily { background: #1f3326; color: #9bdeb1; }
      .tag.todo  { background: #2b2615; color: #ffd58a; }
      .tag.reward{ background: #331f23; color: #ff9aa9; }
      .err { color: #ff8a8a; }
      .muted { color: var(--muted); }
      @media (min-width: 1100px) {
        main { grid-template-columns: 1fr 1fr; }
        .panel.full { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>quest stats</h1>
      <span class="meta" id="meta"></span>
      <span style="flex:1"></span>
      <button id="refresh" title="recarregar dados">↻ recarregar</button>
    </header>
    <main>
      <section class="panel full">
        <h2>Stats do personagem</h2>
        <div class="row" style="margin-bottom:8px">
          <label><input type="checkbox" data-stat="exp" checked /> XP</label>
          <label><input type="checkbox" data-stat="lvl" checked /> Level</label>
          <label><input type="checkbox" data-stat="hp" checked /> HP</label>
          <label><input type="checkbox" data-stat="mp" checked /> MP</label>
          <label><input type="checkbox" data-stat="gp" /> Gold</label>
        </div>
        <div class="chart-wrap big"><canvas id="statsChart"></canvas></div>
      </section>

      <section class="panel full">
        <h2>Atividade de hábitos (counter up acumulado)</h2>
        <div class="row" style="margin-bottom:8px">
          <label>Mostrar:
            <select id="habitMetric">
              <option value="counterUp" selected>counter up (cliques +)</option>
              <option value="value">value (Habitica)</option>
              <option value="counterDown">counter down (cliques -)</option>
            </select>
          </label>
          <label>Top N (por atividade):
            <select id="habitTopN">
              <option>5</option>
              <option selected>10</option>
              <option>20</option>
              <option value="999">todos</option>
            </select>
          </label>
        </div>
        <div class="chart-wrap big"><canvas id="habitsChart"></canvas></div>
      </section>

      <section class="panel">
        <h2>Tasks atuais</h2>
        <table id="tasksTable">
          <thead><tr><th>tipo</th><th>nome</th><th style="text-align:right">value</th><th style="text-align:right">+ / −</th><th style="text-align:right">streak</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Resumo</h2>
        <div id="summary" class="muted">carregando…</div>
      </section>
    </main>

    <script>
      const fmtTs = (s) => new Date(s).toLocaleString();
      const palette = [
        "#8b5cf6","#22d3ee","#34d399","#fbbf24","#f472b6","#60a5fa",
        "#f87171","#a3e635","#e879f9","#fb923c","#2dd4bf","#c084fc",
      ];

      const STAT_COLORS = {
        exp: "#fbbf24",
        lvl: "#a78bfa",
        hp:  "#f87171",
        mp:  "#60a5fa",
        gp:  "#facc15",
      };

      let statsChart, habitsChart;
      let tasksData = { tasks: [], points: [] };
      let userStats = [];

      async function fetchJson(path) {
        const r = await fetch(path, { cache: "no-store" });
        if (!r.ok) throw new Error(`${path}: ${r.status}`);
        return r.json();
      }

      function renderStats() {
        const enabled = new Set(
          [...document.querySelectorAll('input[data-stat]')]
            .filter((i) => i.checked)
            .map((i) => i.dataset.stat),
        );

        const datasets = ["exp","lvl","hp","mp","gp"]
          .filter((k) => enabled.has(k))
          .map((k) => ({
            label: k.toUpperCase(),
            data: userStats
              .map((p) => ({ x: p.ts, y: p.stats?.[k] }))
              .filter((p) => p.y != null),
            borderColor: STAT_COLORS[k],
            backgroundColor: STAT_COLORS[k] + "33",
            tension: 0.18,
            pointRadius: 2,
            borderWidth: 2,
            yAxisID: (k === "lvl") ? "y2" : "y",
          }));

        if (statsChart) { statsChart.destroy(); }
        statsChart = new Chart(document.getElementById("statsChart"), {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", axis: "x", intersect: false },
            scales: {
              x: { type: "time", time: { tooltipFormat: "PPp" }, ticks: { color: "#8a91a3" }, grid: { color: "#22262f" } },
              y: { position: "left", ticks: { color: "#8a91a3" }, grid: { color: "#22262f" } },
              y2: { position: "right", ticks: { color: "#a78bfa" }, grid: { drawOnChartArea: false }, title: { display: true, text: "level", color: "#a78bfa" } },
            },
            plugins: {
              legend: { labels: { color: "#e6e8ee" } },
              tooltip: { callbacks: { title: (items) => fmtTs(items[0].parsed.x) } },
            },
          },
        });
      }

      function renderHabits() {
        const metric = document.getElementById("habitMetric").value;
        const topN = Number(document.getElementById("habitTopN").value);

        const habits = tasksData.tasks.filter((t) => t.type === "habit");
        const habitIds = new Set(habits.map((h) => h._id));

        const pointsByTask = new Map();
        for (const p of tasksData.points) {
          if (!habitIds.has(p.taskId)) continue;
          if (p[metric] == null) continue;
          if (!pointsByTask.has(p.taskId)) pointsByTask.set(p.taskId, []);
          pointsByTask.get(p.taskId).push({ x: p.ts, y: p[metric] });
        }

        const ranked = habits
          .map((h) => ({
            ...h,
            pts: pointsByTask.get(h._id) ?? [],
          }))
          .filter((h) => h.pts.length >= 1)
          .sort((a, b) => b.pts.length - a.pts.length)
          .slice(0, topN);

        const datasets = ranked.map((h, i) => ({
          label: h.text || "(sem nome)",
          data: h.pts,
          borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length] + "22",
          tension: 0.18,
          pointRadius: 2,
          borderWidth: 2,
          stepped: metric === "counterUp" || metric === "counterDown" ? "before" : false,
        }));

        if (habitsChart) { habitsChart.destroy(); }
        habitsChart = new Chart(document.getElementById("habitsChart"), {
          type: "line",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "nearest", axis: "x", intersect: false },
            scales: {
              x: { type: "time", time: { tooltipFormat: "PPp" }, ticks: { color: "#8a91a3" }, grid: { color: "#22262f" } },
              y: { ticks: { color: "#8a91a3" }, grid: { color: "#22262f" } },
            },
            plugins: {
              legend: { labels: { color: "#e6e8ee", boxWidth: 12, font: { size: 11 } } },
              tooltip: { callbacks: { title: (items) => fmtTs(items[0].parsed.x) } },
            },
          },
        });
      }

      function renderTasksTable() {
        const tb = document.querySelector("#tasksTable tbody");
        tb.innerHTML = "";
        for (const t of tasksData.tasks) {
          const tr = document.createElement("tr");
          const upDown = (t.counterUp != null || t.counterDown != null)
            ? `${t.counterUp ?? 0} / ${t.counterDown ?? 0}` : "—";
          tr.innerHTML = `
            <td><span class="tag ${t.type}">${t.type}</span></td>
            <td>${escape(t.text ?? "")}</td>
            <td style="text-align:right">${t.value != null ? t.value.toFixed(2) : "—"}</td>
            <td style="text-align:right">${upDown}</td>
            <td style="text-align:right">${t.streak ?? "—"}</td>
          `;
          tb.appendChild(tr);
        }
      }

      function renderSummary() {
        const last = userStats[userStats.length - 1];
        const first = userStats[0];
        const habits = tasksData.tasks.filter((t) => t.type === "habit").length;
        const dailies = tasksData.tasks.filter((t) => t.type === "daily").length;
        const todos = tasksData.tasks.filter((t) => t.type === "todo").length;
        const el = document.getElementById("summary");
        if (!last) { el.innerHTML = '<span class="err">sem dados ainda</span>'; return; }
        const s = last.stats;
        el.innerHTML = `
          <div>Level <b>${s.lvl ?? "—"}</b> ${s.class ? `(${s.class})` : ""}</div>
          <div>XP <b>${s.exp?.toFixed(0) ?? "—"}</b> · HP <b>${s.hp?.toFixed(1) ?? "—"}</b> · MP <b>${s.mp?.toFixed(1) ?? "—"}</b> · GP <b>${s.gp?.toFixed(2) ?? "—"}</b></div>
          <div class="muted" style="margin-top:6px">${habits} hábitos · ${dailies} dailies · ${todos} todos</div>
          <div class="muted">série: ${userStats.length} pts · ${fmtTs(first.ts)} → ${fmtTs(last.ts)}</div>
        `;
      }

      function escape(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      }

      async function loadAll() {
        try {
          document.getElementById("meta").textContent = "carregando…";
          [userStats, tasksData] = await Promise.all([
            fetchJson("api/series/user-stats"),
            fetchJson("api/series/tasks"),
          ]);
          renderStats();
          renderHabits();
          renderTasksTable();
          renderSummary();
          document.getElementById("meta").textContent =
            `${userStats.length} stats pts · ${tasksData.points.length} task pts`;
        } catch (err) {
          document.getElementById("meta").innerHTML = `<span class="err">erro: ${escape(err.message)}</span>`;
          console.error(err);
        }
      }

      document.querySelectorAll('input[data-stat]').forEach((i) => i.addEventListener("change", renderStats));
      document.getElementById("habitMetric").addEventListener("change", renderHabits);
      document.getElementById("habitTopN").addEventListener("change", renderHabits);
      document.getElementById("refresh").addEventListener("click", loadAll);
      loadAll();
    </script>
  </body>
</html>
